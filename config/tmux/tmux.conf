# =============================================================================
# プレフィックスキー
# =============================================================================
# プレフィックスをデフォルトの C-b から C-j に変更
unbind C-b
set -g prefix C-j
# C-j を2回押したときは C-j キー自体をペイン内のアプリへ送る
bind C-j send-prefix

# =============================================================================
# 基本設定
# =============================================================================
# ウィンドウ番号を 0 ではなく 1 から振る
set -g base-index 1

# デフォルトシェルを Nushell に設定
set -g default-shell "$HOME/.cargo/bin/nu"

# 256色ターミナルとして動作させる
set -g default-terminal "screen-256color"
# TrueColor (24bit カラー) を有効化
set -g terminal-overrides ',xterm-256color:Tc'
set -as terminal-overrides ",alacritty:RGB"

# ターミナルのフォーカスイベントをペイン内アプリへ透過する
# (vim/nvim の autoread や FocusGained イベントに必要)
set -g focus-events on

# マウス操作を有効化 (ペインの切替・リサイズ、ホイールスクロール)
set -g mouse on

# =============================================================================
# コピーモード
# =============================================================================
# コピーモードのキー操作を vi 風にする
setw -g mode-keys vi
# Enter でコピーを確定すると同時にシステムクリップボードへ転送する (要 xsel)
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "xsel -bi"

# =============================================================================
# キーバインド
# =============================================================================
# prefix + h/j/k/l でペイン間を vim 風に移動
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# prefix + | で左右に分割、prefix + - で上下に分割
# (-c で分割元ペインのカレントディレクトリを引き継ぐ)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# --- 左サイドバー関連 (詳細は「左サイドバー」セクション) ---
# prefix + b: サイドバーの表示/非表示をトグル (狭端末での手動退避にも使える)
bind b run-shell "~/.config/tmux/sidebar.sh toggle"
# prefix + B: 展開モード (現在セッションのみ / 全セッション) をトグル
bind B run-shell "~/.config/tmux/sidebar.sh expand-toggle"
# prefix + R: 全ウィンドウのサイドバーを作り直す (表示がウィンドウごとにズレたとき、
#   および sidebar-render.sh を編集した後のリセット用。常駐レンダラは起動時のコードを
#   回し続けるため、source-file だけでは既存ウィンドウに反映されない)
bind R run-shell "~/.config/tmux/sidebar.sh restart"
# prefix + Tab: セッション/ウィンドウ/ペインのポップアップ・チューザ (fzf, 方式 B)
bind Tab display-popup -E -w 80% -h 70% "~/.config/tmux/sidebar-chooser.sh"
# prefix + =: 作業ペインを縦横とも等分に均す (サイドバーは除外し @sidebar_width のまま)
#   横並びペインは幅を、縦積みペインは高さを等分する
bind = run-shell "~/.config/tmux/sidebar.sh rebalance"

# =============================================================================
# ペインの外観 (アクティブペインの強調)
# =============================================================================
# 非アクティブペインの境界線: 暗いグレーの細線
set -g pane-border-style "fg=#454b68"
# アクティブペインの境界線: iceberg の水色 (cyan)。fg/bg 両方を塗るとセル全面が
# 埋まって特に水平ボーダーが太く見えるため、fg のみにして線 (heavy グリフ) で描く
set -g pane-active-border-style "fg=#89b8c2"
# 境界線を二重罫線グリフで描画 (アクティブ枠を少し太く見せる)。
# pane-border-lines は全ボーダー共通のため、非アクティブ枠も二重線になる
set -g pane-border-lines double
# tmux 標準の矢印インジケータはグリフ 1 文字で小さいため無効化し、
# アクティブ表示は 境界線の色 (水色) と pane-title.sh の大きめ矢印マーカーで行う
set -g pane-border-indicators off
# 各ペイン上辺のタイトルバーに「ペイン番号: 実行中コマンド カレントディレクトリ」を表示。
# 表示内容とスタイルの組み立てはすべて pane-title.sh 側で行う:
#   - アクティブペインは水色背景・太字・先頭に矢印 ▶、非アクティブはグレー
#   - Claude Code 実行中はフック (~/.claude/settings.json) が設定する
#     @claude_state に応じて 橙=応答生成中 / 青=入力待ち に変わる
#   - ディレクトリはホームからの相対パスで最後の2階層のみ
set -g pane-border-format "#(~/.config/tmux/pane-title.sh '#{pane_id}' '#{pane_active}' '#{pane_index}' '#{pane_tty}' '#{pane_current_command}' '#{pane_current_path}')"
# タイトルバー内の #() コマンドの再実行間隔 (秒)。
# Claude Code の状態色が切り替わるまでの遅延もこれで決まる
set -g status-interval 5
# タイトルバーは常にペイン上辺に表示する
# (ペインを分割していない = ペインが1つだけのウィンドウでも表示する)
set -g pane-border-status top
# ペイン内部の配色 (アクティブペインは背景をわずかに暗くして区別)
set -g window-style 'fg=#c6c8d1,bg=#1e2132'
set -g window-active-style 'fg=#c6c8d1,bg=#161825'

# =============================================================================
# 左サイドバー (git コンテキスト + セッション/ウィンドウ/ペイン一覧 + claude/copilot 状態)
# 各ウィンドウの左端に幅固定の専用ペインを常駐させ、~/.config/tmux/sidebar-render.sh
# が以下を描く:
#   1. ヘッダ … 現在ペインの プロジェクト名 / worktree 名 / ブランチ / 変更数・ahead-behind
#      (▌=プロジェクト, ⑂=linked worktree, =ブランチ。worktree 名がブランチ由来で
#       重複する場合はブランチ行を省く。feature- のような種別プレフィックスは薄字)
#   2. ツリー … セッション→ウィンドウ→ペイン。ウィンドウ見出しは git 管理下なら
#      プロジェクト名 + worktree 名 (ウィンドウ名は自動リネームでコマンド名になり
#      ペイン行と重複するため)。各ペインの状態は herdr 風 (working/blocked/idle/active)
# 生成・破棄・幅ピン・自動退避・トグルは ~/.config/tmux/sidebar.sh が担当。
# git 情報は ~/.config/tmux/sidebar-git.sh が数秒おきにキャッシュへ書き出したものを読む
# (git status は大きなリポジトリで 200ms 超かかり 0.5 秒の描画ループに載らないため)。
# claude の状態は既存の @claude_state (~/.claude/settings.json のフック) を再利用し、
# copilot は単一実行バイナリなので #{pane_current_command}==copilot で「起動中」を検知する。
# =============================================================================
set -g @sidebar_width 36          # サイドバー幅 (桁)。worktree 名が読める幅に取ってある
set -g @sidebar_min_cols 100      # 端末幅がこれ未満なら自動退避
set -g @sidebar_enabled 1         # 既定で表示 (prefix + b で反転)
set -g @sidebar_expand 0          # 0=現在セッションのみ展開 / 1=全展開 (prefix + B)

# 新規ウィンドウ・新規セッション・クライアント接続時に各ウィンドウへサイドバーを用意
set-hook -g after-new-window      'run-shell "~/.config/tmux/sidebar.sh ensure-window #{window_id}"'
set-hook -g session-created       'run-shell "~/.config/tmux/sidebar.sh ensure-all"'
set-hook -g client-attached       'run-shell "~/.config/tmux/sidebar.sh ensure-all"'
# レイアウト変更で崩れた幅を規定値へ戻す (resize は冪等化してあるのでループしない)
set-hook -g window-layout-changed 'run-shell "~/.config/tmux/sidebar.sh pin #{window_id}"'
# 端末リサイズ: 狭くなれば自動退避、広がれば復帰 (閾値をまたいだときだけ動く)
set-hook -g client-resized        'run-shell "~/.config/tmux/sidebar.sh reflow"'
# サイドバーにフォーカスが入ったら即座に右の作業ペインへ弾き返す (侵入経路を一網打尽)
set-hook -g pane-focus-in         "if-shell -F '#{@sidebar}' 'select-pane -R'"
# 作業ペイン (サイドバー以外) を全て閉じたら、サイドバーだけが残って生き続ける
# ウィンドウを丸ごと閉じる。閉じ方によって発火するフックが異なるため両方を張る:
#   - pane-exited        … シェル終了 (exit / Ctrl-D) 由来のクローズを拾う
#   - window-pane-changed … kill-pane (prefix + x) など アクティブペイン切替を
#                           伴うクローズを拾う (pane-exited では拾えない)
# prune はサイドバーだけのウィンドウ以外には何もしない冪等処理なので、通常の
# ペイン切替やウィンドウ生成の途中で重複して呼ばれても安全。
set-hook -g pane-exited           'run-shell "~/.config/tmux/sidebar.sh prune #{window_id}"'
set-hook -g window-pane-changed   'run-shell "~/.config/tmux/sidebar.sh prune #{window_id}"'

# 設定読み込み時 (source-file 含む) に既存の全ウィンドウへ一括生成
run-shell "~/.config/tmux/sidebar.sh ensure-all"
# 既存のゴーストウィンドウ (サイドバーだけが残ったもの) を初期化時に一掃する
run-shell "~/.config/tmux/sidebar.sh prune-all"

# =============================================================================
# ステータスバー (iceberg テーマ)
# ベース: https://github.com/gkeep/iceberg-dark の iceberg.tmux.conf
# =============================================================================
# ステータスバーを表示し、ウィンドウリストを中央寄せにする
set -g status "on"
set -g status-justify "centre"
# バー全体の配色
set -g status-style "none,bg=#1e2132"
# 左右セクションの最大表示幅
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left-style "none"
set -g status-right-style "none"
# コマンドプロンプトとメッセージ表示の配色
set -g message-style "fg=#c6c8d1,bg=#2e3244"
set -g message-command-style "fg=#c6c8d1,bg=#2e3244"
# ウィンドウタブの基本配色と、アクティビティ通知時の配色
setw -g window-status-style "none,fg=#c6c8d1,bg=#1e2132"
setw -g window-status-activity-style "none,fg=#454b68,bg=#1e2132"
# タブ同士の間には何も挟まない
setw -g window-status-separator ""

# --- 表示モジュール ---
# 左側: ユーザー名 / 時刻(24h表記)と曜日
module_left_1="#(whoami)"
module_left_2="%R %a"
# 右側: ローカルIPアドレス (Linux の ip コマンド前提) / ホスト名
module_right_1="#(ip route get 1 | awk '{print $7}')"
module_right_2="#H"

# --- powerline 風セパレータ (Nerd Font のグリフ) ---
separator_left="\ue0bc"
separator_right="\ue0ba"
subseparator_left="\ue0bb"
subseparator_right="\ue0bd"

# --- \u30a6\u30a3\u30f3\u30c9\u30a6\u30bf\u30d6\u306b\u8868\u793a\u3059\u308b\u540d\u524d ---
# #W (\u81ea\u52d5\u30ea\u30cd\u30fc\u30e0\u306e\u540d\u524d) \u306f #{pane_current_command} \u7531\u6765\u306e\u305f\u3081\u3001Claude Code \u306e
# \u3088\u3046\u306b\u30d0\u30fc\u30b8\u30e7\u30f3\u756a\u53f7\u540d\u306e\u30d0\u30a4\u30ca\u30ea\u3067\u52d5\u304f\u30c4\u30fc\u30eb\u3060\u3068\u300c2.1.204\u300d\u306e\u3088\u3046\u306a\u8868\u793a\u306b\u306a\u308b\u3002
# \u81ea\u52d5\u30ea\u30cd\u30fc\u30e0\u304c\u6709\u52b9\u306a\u9593\u306f argv \u304b\u3089\u89e3\u6c7a\u3057\u305f\u30b3\u30de\u30f3\u30c9\u540d (claude, opencode \u306a\u3069) \u3092
# \u8868\u793a\u3057\u3001\u624b\u52d5\u3067\u4ed8\u3051\u305f\u540d\u524d (prefix + ,) \u306f\u305d\u306e\u307e\u307e\u5c0a\u91cd\u3059\u308b
window_name="#{?automatic-rename,#(~/.config/tmux/command-name.sh '#{pane_tty}' '#{pane_current_command}'),#W}"

# 左セクション: ユーザー名 → 時刻・曜日
set -g status-left "#[fg=#c6c8d1,bg=#454b68,bold] $module_left_1 #[fg=#454b68,bg=#2e3244,nobold,nounderscore,noitalics]$separator_left#[fg=#c6c8d1,bg=#2e3244] $module_left_2 #[fg=#2e3244,bg=#1e2132,nobold,nounderscore,noitalics]$separator_left#[fg=#c6c8d1,bg=#1e2132] #[fg=#1e2132,bg=#1e2132,nobold,nounderscore,noitalics]$separator_left"
# 右セクション: IPアドレス → ホスト名
set -g status-right "#[fg=#1e2132,bg=#1e2132,nobold,nounderscore,noitalics]$separator_right#[fg=#c6c8d1,bg=#1e2132] #[fg=#2e3244,bg=#1e2132,nobold,nounderscore,noitalics]$separator_right#[fg=#c6c8d1,bg=#2e3244] $module_right_1 #[fg=#454b68,bg=#2e3244,nobold,nounderscore,noitalics]$separator_right#[fg=#c6c8d1,bg=#454b68,bold] $module_right_2 #{prefix_highlight}"
# ウィンドウ一覧は左サイドバーへ一本化したため、上部バー中央のタブ表示は撤去する
# (時刻・ホスト等のメタ情報は status-left / status-right に残す)。
# サイドバーを使わない場合の切替は prefix + Tab (チューザ) / prefix + w / prefix + 数字 で。
setw -g window-status-format ""
setw -g window-status-current-format ""
